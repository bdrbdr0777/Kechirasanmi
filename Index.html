<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meni kechirasanmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito+Sans:wght@400;700&display=swap">
<style>
  :root {
    --bg: #1d0f2e; --bg-2: #4a1d5c;
    --glow-a: #ff6f91; --glow-b: #ffb86b; --glow-c: #7a5cff;
    --fg: #fff4f6; --fg-soft: #f3cfe0;
    --ha: #ff5d86; --ha-fg: #2a0a1c;
    --no: rgba(255,255,255,0.14); --no-fg: #fff4f6;
    --font-display: "Gloock", Georgia, "Times New Roman", serif;
    --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 18px; line-height: 1.5;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow: hidden; position: relative;
  }
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 80% at 50% 110%, var(--bg-2) 0%, transparent 60%),
      linear-gradient(180deg, #120824 0%, var(--bg) 45%, #5a2166 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; animation: drift 18s ease-in-out infinite alternate; }
  .blob.a { width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax; background: var(--glow-a); }
  .blob.b { width: 40vmax; height: 40vmax; right: -14vmax; bottom: -8vmax; background: var(--glow-c); animation-duration: 22s; }
  .blob.c { width: 28vmax; height: 28vmax; left: 38%; bottom: -12vmax; background: var(--glow-b); opacity: 0.4; animation-duration: 26s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(5vmax,4vmax,0) scale(1.12); } }
  .floaters { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .floater { position: absolute; bottom: -40px; color: var(--glow-a); opacity: 0; animation: rise linear infinite; will-change: transform, opacity; }
  @keyframes rise {
    0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% { transform: translate3d(var(--sway, 30px), -110vh, 0) rotate(40deg); opacity: 0; }
  }
  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 36px; }
  .eyebrow { margin: 0; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-soft); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.6rem, 11vw, 6rem); line-height: 1.04; text-wrap: balance; max-width: 14ch; text-shadow: 0 6px 40px rgba(255,111,145,0.45); }
  .sub { margin: 0; max-width: 34ch; color: var(--fg-soft); text-wrap: balance; min-height: 1.5em; }
  .choices { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; cursor: pointer; padding: 14px 40px; min-width: 120px; transition: transform 0.25s ease, box-shadow 0.25s ease, left 0.18s ease-out, top 0.18s ease-out; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  #ha { background: var(--ha); color: var(--ha-fg); font-size: 1.1rem; box-shadow: 0 10px 30px rgba(255,93,134,0.5); transform: scale(var(--grow, 1)); }
  #ha:hover { box-shadow: 0 14px 40px rgba(255,93,134,0.75); }
  #yoq { background: var(--no); color: var(--no-fg); border: 1px solid rgba(255,255,255,0.28); backdrop-filter: blur(6px); touch-action: none; z-index: 5; }
  #yoq.fled { position: fixed; }
  #yoq-slot { display: inline-block; }
  .done { display: none; }
  body.accepted .ask { display: none; }
  body.accepted .done { display: flex; }
  .done { flex-direction: column; align-items: center; gap: 20px; }
  .done h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 9vw, 4.4rem); line-height: 1.08; text-wrap: balance; text-shadow: 0 6px 40px rgba(255,111,145,0.45); }
  .done p { margin: 0; color: var(--fg-soft); max-width: 32ch; text-wrap: balance; }
  .burst { position: fixed; z-index: 4; pointer-events: none; color: var(--glow-a); animation: pop 1.6s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate3d(0,0,0) scale(0.4); opacity: 1; }
    100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.2) rotate(var(--rot, 0deg)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .floater { animation: none; }
    .floater { display: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
</div>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main>
  <section class="ask" id="ask">
    <p class="eyebrow">Sendan bitta savolim bor</p>
    <h1>Meni kechirasanmi?</h1>
  </section>

  <p class="sub ask" id="sub">Iltimos, to'g'ri javob ber.</p>

  <div class="choices ask">
    <button id="ha" type="button">Ha</button>
    <span id="yoq-slot"><button id="yoq" type="button" tabindex="-1">Yo'q</button></span>
  </div>

  <section class="done" id="done" aria-live="polite">
    <h2>Rahmat, kechirganing uchun!</h2>
    <p>Seni xafa qilganimdan afsusdaman. Bundan keyin yaxshiroq bo'laman.</p>
  </section>
</main>

<script>
(function () {
  var heart = '<svg width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  var ha = document.getElementById('ha');
  var yoq = document.getElementById('yoq');
  var slot = document.getElementById('yoq-slot');
  var sub = document.getElementById('sub');
  var floaters = document.getElementById('floaters');

  var lines = [
    "Iltimos, to'g'ri javob ber.",
    "Bu tugma sal qiyin ekan, a?",
    "Yana urinib ko'rasanmi?",
    "Ushlab bo'lmaydi.",
    "Ha tugmasi ancha qulay ko'rinadi.",
    "Yo'q tugmasi charchamaydi.",
    "Faqat bitta tugma bosiladi."
  ];
  var dodges = 0;

  function lockSlot() {
    var r = yoq.getBoundingClientRect();
    slot.style.width = r.width + 'px';
    slot.style.height = r.height + 'px';
  }
  function rect(el) { return el.getBoundingClientRect(); }

  function flee(px, py) {
    if (!yoq.classList.contains('fled')) { lockSlot(); yoq.classList.add('fled'); }
    var w = yoq.offsetWidth, h = yoq.offsetHeight, m = 16;
    var maxX = Math.max(m, window.innerWidth - w - m);
    var maxY = Math.max(m, window.innerHeight - h - m);
    var haR = rect(ha), best = null, bestScore = -1;
    for (var i = 0; i < 24; i++) {
      var x = m + Math.random() * (maxX - m);
      var y = m + Math.random() * (maxY - m);
      var cx = x + w / 2, cy = y + h / 2;
      var d = (px == null) ? 200 : Math.hypot(cx - px, cy - py);
      var overlapHa = !(x + w < haR.left - 12 || x > haR.right + 12 || y + h < haR.top - 12 || y > haR.bottom + 12);
      if (overlapHa) d *= 0.1;
      if (d > bestScore) { bestScore = d; best = { x: x, y: y }; }
    }
    yoq.style.left = best.x + 'px';
    yoq.style.top = best.y + 'px';
    dodges++;
    sub.textContent = lines[dodges % lines.length];
    ha.style.setProperty('--grow', Math.min(1 + dodges * 0.06, 1.6));
  }

  function onApproach(e) {
    var p = e.touches && e.touches[0] ? e.touches[0] : e;
    flee(p.clientX, p.clientY);
  }

  yoq.addEventListener('pointerenter', onApproach);
  yoq.addEventListener('pointerdown', function (e) { e.preventDefault(); onApproach(e); });
  yoq.addEventListener('touchstart', function (e) { e.preventDefault(); onApproach(e); }, { passive: false });
  yoq.addEventListener('mousedown', function (e) { e.preventDefault(); onApproach(e); });
  yoq.addEventListener('focus', function () { flee(null, null); yoq.blur(); });
  yoq.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); onApproach(e); });

  document.addEventListener('pointermove', function (e) {
    var r = rect(yoq);
    if (!yoq.classList.contains('fled')) {
      var near = e.clientX > r.left - 40 && e.clientX < r.right + 40 && e.clientY > r.top - 40 && e.clientY < r.bottom + 40;
      if (near) flee(e.clientX, e.clientY);
      return;
    }
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 90) flee(e.clientX, e.clientY);
  });

  window.addEventListener('resize', function () {
    if (!yoq.classList.contains('fled')) return;
    var r = rect(yoq);
    var maxX = Math.max(16, window.innerWidth - r.width - 16);
    var maxY = Math.max(16, window.innerHeight - r.height - 16);
    yoq.style.left = Math.min(r.left, maxX) + 'px';
    yoq.style.top = Math.min(r.top, maxY) + 'px';
  });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    for (var i = 0; i < 16; i++) {
      var f = document.createElement('div');
      f.className = 'floater';
      var s = 12 + Math.random() * 22;
      f.style.width = s + 'px';
      f.style.height = s + 'px';
      f.style.left = (Math.random() * 100) + '%';
      f.style.animationDuration = (12 + Math.random() * 14) + 's';
      f.style.animationDelay = (-Math.random() * 20) + 's';
      f.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
      f.style.color = Math.random() > 0.5 ? '#ff6f91' : '#ffb86b';
      f.innerHTML = heart;
      floaters.appendChild(f);
    }
  }

  ha.addEventListener('click', function () {
    document.body.classList.add('accepted');
    yoq.hidden = true;
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (var i = 0; i < 36; i++) {
      var b = document.createElement('div');
      b.className = 'burst';
      var s = 14 + Math.random() * 26;
      var ang = Math.random() * Math.PI * 2;
      var dist = 120 + Math.random() * Math.min(window.innerWidth, 500) * 0.6;
      b.style.width = s + 'px';
      b.style.height = s + 'px';
      b.style.left = cx + 'px';
      b.style.top = cy + 'px';
      b.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      b.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      b.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
      b.style.color = ['#ff6f91', '#ffb86b', '#ffffff', '#ff9ac1'][i % 4];
      b.innerHTML = heart;
      document.body.appendChild(b);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(b);
    }
  });
})();
</script>
</body>
</html>
